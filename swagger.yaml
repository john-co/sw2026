openapi: 3.0.3
info:
  title: E-commerce Checkout API
  version: 1.0.0
  description: In-memory API for registration, login, and checkout.
servers:
  - url: http://localhost:3000
paths:
  /register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
        "400":
          description: Invalid request
        "409":
          description: Email already registered
  /login:
    post:
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "401":
          description: Invalid credentials
  /checkout:
    post:
      summary: Calculate an authenticated checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout calculated
        "400":
          description: Invalid payment method, product, or quantity
        "401":
          description: Authentication required
  /healthcheck:
    get:
      summary: Check API health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Dana Lee
        email:
          type: string
          format: email
          example: dana@example.com
        password:
          type: string
          format: password
          example: password123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: password123
    CheckoutRequest:
      type: object
      required: [items, paymentMethod]
      properties:
        paymentMethod:
          type: string
          enum: [cash, credit_card]
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: integer
                example: 1
              quantity:
                type: integer
                minimum: 1
                example: 2
